<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TEST</title>

  <style>
    body {
      margin: 0;
      font-family: monospace;
    }
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      box-sizing: border-box;
      padding: 25px 80px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      z-index: 100;
      transition: 0.4s ease;
    }
    .navbar.scrolled {
      background: rgba(15, 15, 15, 0.95);
      backdrop-filter: blur(10px);
      box-shadow: 0 2px 20px rgba(0,0,0,0.2);
    }
    .nav-left {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .nav-left img {
      height: 50px;
      width: auto;
    }
    .nav-left span {
      color: white;
      font-size: 1.3rem;
      font-weight: bold;
    }
    .nav-links {
      display: flex;
      gap: 40px;
      list-style: none;
      margin: 0;
      padding: 0;
    }
    .nav-links a {
      color: white;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 500;
      transition: 0.3s;
    }
    .nav-links a:hover {
      opacity: 0.7;
    }
    .slider {
      width: 1300px;
      max-width: 100vw;
      height: 700px;
      margin: auto;
      position: relative;
      overflow: hidden;
    }
    .slider::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
      background: linear-gradient(to bottom, rgba(0, 0, 0, 0.75) 0%, rgba(0, 0, 0, 0.45) 30%, rgba(0, 0, 0, 0.20) 60%, rgba(0, 0, 0, 0.50) 100%);
    }
    .list {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      display: flex;
      width: max-content;
      transition: 1.5s;
    }
    .list img{
      width: 1300px;
      max-width: 100vw;
      height: 100%;
      object-fit: cover;
    }
    .buttons {
      position: absolute;
      top: 45%;
      left: 5%;
      width: 90%;
      display: flex;
      justify-content: space-between;
    }
    .buttons button {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background-color: #fff5;
      color: #fff;
      border: none;
      font-family: monospace;
      font-weight: bold;
    }
    .dots {
      position: absolute;
      bottom: 10px;
      color: #fff;
      left: 0;
      width: 100%;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
    }
    .dots li {
      list-style: none;
      width: 10px;
      height: 10px;
      background-color: #fff;
      margin: 20px;
      border-radius: 20px;
      transition: 1.5s;
    }
    .dots li.active {
      width: 30px;
    }
    .slider-text {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 4;
      color: white;
      text-align: center;
      width: 80%;
    }
    .slider-text h1 {
      margin: 0;
      font-size: 4rem;
      font-weight: bold;
    }
    .slider-text p {
      margin-top: 15px;
      font-size: 1.2rem;
    }
    .fade-text {
      animation: fadeText 2.5s ease;
    }
    @keyframes fadeText {
      0% {
        opacity: 0;
        transform: translate(-50%, -40%);
      }
      100% {
        opacity: 1;
        transform: translate(-50%, -50%);
      }
    }
    @media screen and (max-width: 768px) {
      .slider {
        height: 400px;
      }
    }
  </style>
</head>
<body>
  <!--Navbar-->
  <nav class="navbar">
  <div class="nav-left">
    <img src="logo.png" alt="Logo">
    <span>COMPANY NAME</span>
  </div>

  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="#">About Us</a></li>
    <li><a href="#">Projects</a></li>
    <li><a href="#">Services</a></li>
    <li><a href="#">Contact Us</a></li>
  </ul>
  </nav>

  <!--Slider-->
  <div class="slider" id="heroSlider">
    <div class="list">
      <div class="item">
        <img src="slider_img_1.jpg" alt="">
      </div>
      <div class="item">
        <img src="slider_img_2.jpg" alt="">
      </div>
      <div class="item">
        <img src="slider_img_3.jpg" alt="">
      </div>
      <div class="item">
        <img src="slider_img_4.jpg" alt="">
      </div>
      <div class="item">
        <img src="slider_img_5.jpg" alt="">
      </div>
    </div>

    <div class="slider-text">
      <h1 id="slideTitle">C&M PARTNERS</h1>
      <p id="slideDesc">Dream, Design, Develop</p>
    </div>
    
    <div class="buttons">
      <button id="prev"><</button>
      <button id="next">></button>
    </div>
    <ul class="dots">
      <li class="active"></li>
      <li></li>
      <li></li>
      <li></li>
      <li></li>
    </ul>
  </div>

  <!--Contents-->
  <div class="container">

  </div>
  
  <script>
    let list = document.querySelector('.slider .list');
    let items = document.querySelectorAll('.slider .list .item');
    let dots = document.querySelectorAll('.slider .dots li');
    let prev = document.getElementById('prev');
    let next = document.getElementById('next');
    let slideTitle = document.getElementById('slideTitle');
    let slideDesc = document.getElementById('slideDesc');

    let active = 0;
    let lengthItems = items.length - 1;
    
    next.onclick = function(){
      if(active + 1 > lengthItems){
        active = 0;
      }
      else{
        active = active + 1;
      }
      reloadSlider();
    }
    prev.onclick = function(){
      if(active - 1 < 0){
        active = lengthItems;
      }
      else{
        active = active - 1;
      }
      reloadSlider();
    }
    let refreshSlider = setInterval(()=> {next.click()}, 5000);
    function reloadSlider(){
      let checkLeft = items[active].offsetLeft;
      list.style.left = -checkLeft + 'px';

      let lastActiveDot = document.querySelector('.slider .dots li.active');
      lastActiveDot.classList.remove('active');
      dots[active].classList.add('active');
      slideTitle.textContent = slideContent[active].title;
      slideDesc.textContent = slideContent[active].desc;
      document.querySelector('.slider-text').classList.remove('fade-text');
      void document.querySelector('.slider-text').offsetWidth;
      document.querySelector('.slider-text').classList.add('fade-text');
      clearInterval(refreshSlider);
      refreshSlider = setInterval(()=> {next.click()}, 5000);

    }
    dots.forEach((li, key) => {
      li.addEventListener('click', function(){
        active = key;
        reloadSlider();
      })
    })
    const navbar = document.querySelector('.navbar');
    const heroSlider = document.getElementById('heroSlider');
    window.addEventListener('scroll', () => {
      const sliderHeight = heroSlider.offsetHeight;
      if(window.scrollY > sliderHeight - 100){
        navbar.classList.add('scrolled');
      }
      else{
        navbar.classList.remove('scrolled');
      }
    }); 

    const slideContent = [
    {
      title: "C&M PARTNERS",
      desc: "Dream, Design, Develop"
    },
    {
      title: "DREAM",
      desc: "Turn your dream home into reality."
    },
    {
      title: "DESIGN",
      desc: "Design your ideas."
    },
    {
      title: "DEVELOP",
      desc: "Develop your perspective."
    },
    {
      title: "A New Foundation",
      desc: "What you build today, will shape tomorrow."
    }
    ];
  </script>
</body>
</html>
